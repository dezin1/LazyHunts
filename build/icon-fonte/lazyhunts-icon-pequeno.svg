<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Variante para 16 e 24 px: a forma da lua é o que reconhece o ícone.
       Lua mais grossa, flecha sem penas, sem corda e sem estrela, sem borda. -->
  <defs>
    <linearGradient id="lhsGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0D272"/><stop offset="1" stop-color="#BE9424"/></linearGradient>
    <linearGradient id="lhsTile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#261D12"/><stop offset="1" stop-color="#110C07"/></linearGradient>
    <mask id="lhsMoon"><rect width="64" height="64" fill="#000"/><circle cx="30" cy="32" r="23" fill="#fff"/><circle cx="39.5" cy="32" r="18" fill="#000"/></mask>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="13" fill="url(#lhsTile)"/>
  <g transform="rotate(135 32 32)">
    <rect width="64" height="64" fill="url(#lhsGold)" mask="url(#lhsMoon)"/>
    <path d="M47 32 H14" stroke="#E8DEC7" stroke-width="5" stroke-linecap="round"/>
    <path d="M3 32 L16 24 L16 40 Z" fill="#E8DEC7"/>
  </g>
</svg>
